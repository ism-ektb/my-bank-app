server:
  port: 8082

spring:
  application:
    name: currency-rate-app
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
          jwk-set-uri: http://localhost:9000/oauth2/jwks


logging:
  level:
    org.springframework.security: trace
    org.springframework.web: trace

management:
  endpoints:
    web:
      exposure:
        include: "*"