apiVersion: v1
kind: ConfigMap
metadata:
  name: my-configmap  # Имя ConfigMap будет комбинироваться с именем релиза
data:
  DATABASE_URL: {{ tpl .Values.database.url . | quote}}
  DATABASE_USERNAME: {{ .Values.database.username | quote}}
  DATABASE_PASSWORD: {{ .Values.database.password | quote}}
  KEYCLOAK.URL: {{ tpl .Values.service_url.keycloak_url . | quote}}
  NOTIFICATION.URL: {{ tpl .Values.service_url.notification_url . | quote}}
  ACCOUNT.SECRET: {{ .Values.account_secret | quote}}