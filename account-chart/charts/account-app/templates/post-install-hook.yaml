apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-post-install-hook
  annotations:
    helm.sh/hook: "post-install"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: my-container
          image: ghcr.io/ism-ektb/my-bank-liquibase:1.0.2
          envFrom:
            - configMapRef:
                name: hook-configmap
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "global.appSecrets.name is required" .Values.global.appSecrets.name }}
                  key: {{ .Values.global.appSecrets.keys.databasePassword }}
