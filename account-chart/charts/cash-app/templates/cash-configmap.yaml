apiVersion: v1
kind: ConfigMap
metadata:
  name: cash-configmap  # Имя ConfigMap будет комбинироваться с именем релиза
data:
  KEYCLOAK.URL: {{ tpl .Values.service_url.keycloak_url . | quote}}
  KAFKA.URL: {{ tpl .Values.service_url.kafka_url . | quote}}
  CASH.SECRET: {{ .Values.cash_secret | quote}}
  ACCOUNT.URL: {{ tpl .Values.service_url.account_url . | quote}}
  ZIPKIN.URL: {{ tpl .Values.service_url.zipkin_url . | quote}}