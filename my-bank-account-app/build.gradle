plugins {
    id("java")
    id("org.springframework.boot") version "3.5.14"
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.cloud.contract' version("4.3.4")
    id 'maven-publish'
}


ext {
    mapstructVersion = "1.6.3"
    springCloudVersion = "2025.0.3"
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation("org.springframework.kafka:spring-kafka")
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'  // Мост между Micrometer и Brave
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave' // Библиотека для отправки спанов в zipkin
    implementation 'io.r2dbc:r2dbc-proxy'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    implementation(project(":my-bank-dto"))
    testImplementation(project(":my-bank-liquibase"))
    implementation platform('org.testcontainers:testcontainers-bom:2.0.2')
    testImplementation('org.springframework.boot:spring-boot-testcontainers')
    testImplementation('org.testcontainers:testcontainers-postgresql')
    testImplementation('org.testcontainers:testcontainers-junit-jupiter')
    testImplementation('org.testcontainers:r2dbc:1.21.4')
    testImplementation("org.springframework.cloud:spring-cloud-starter-contract-verifier:4.3.4")
    testImplementation 'io.rest-assured:spring-web-test-client:6.0.1'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion"
    }
}

contracts {
    testMode = 'WEBTESTCLIENT'
    baseClassForTests.set(
            "ru.ism.mybankaccountapp.service.contract.BaseAccountsContractTest"
    )
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from(components["java"])
            artifact(tasks.named("verifierStubsJar"))
        }
    }
}

