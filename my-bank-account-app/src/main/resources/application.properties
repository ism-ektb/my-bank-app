spring.application.name=my-bank-account-app

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:6432/market
spring.datasource.username=user
spring.datasource.password=user
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=account_service
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create

management.endpoints.web.exposure.include="*"

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/bank-realm

logging.level.org.springframework.security=trace
