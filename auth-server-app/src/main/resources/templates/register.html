<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 420px;
            background: white;
            border: 1px solid #dfe7f1;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccd6e2;
            border-radius: 8px;
            font-size: 14px;
        }

        .error {
            color: #d93025;
            font-size: 12px;
            margin-top: 4px;
        }

        .alert {
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .alert-error {
            background: #fbe9e7;
            color: #b42318;
            border: 1px solid #f4c7c3;
        }

        button {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            margin-top: 16px;
            color: #4b5563;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Регистрация</h2>
    <H3>Проект демонстрационный, не вводите реальные данные</H3>

    <div th:if="${param.error != null and !#arrays.isEmpty(param.error)}" class="alert alert-error">
        <span th:text="${param.error[0]}"></span>
    </div>

    <form th:action="@{/auth/register}" th:object="${user}" method="post">
        <div class="field">
            <label for="login">Логин</label>
            <input id="login" th:field="*{login}" type="text">
            <div class="error" th:if="${#fields.hasErrors('login')}" th:errors="*{login}"></div>
        </div>

        <div class="field">
            <label for="name">Фамилия и Имя</label>
            <input id="name" th:field="*{name}" type="text">
            <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="field">
            <label for="birthDate">Дата Рождения</label>
            <input id="birthDate" th:field="*{birthDate}" type="date" class="form-control">
            <div class="error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
        </div>

        <div class="field">
            <label for="password">Пароль</label>
            <input id="password" th:field="*{password}" type="password">
            <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>


        <button type="submit">Зарегистрироваться</button>
    </form>

    <div class="footer">
        Уже есть аккаунт? <a th:href="@{/auth/login}">Войти</a>
    </div>
</div>
</body>
</html>
