<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            width: 420px;
            background: white;
            border: 1px solid #dfe7f1;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .field {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccd6e2;
            border-radius: 8px;
            font-size: 14px;
        }
        .alert {
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .alert-success {
            background: #eafaf1;
            color: #13795b;
            border: 1px solid #bfead2;
        }
        .alert-error {
            background: #fbe9e7;
            color: #b42318;
            border: 1px solid #f4c7c3;
        }
        button {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
        }
        .footer {
            text-align: center;
            margin-top: 16px;
            color: #4b5563;
        }
        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Вход</h2>

    <div th:if="${param.success != null and !#arrays.isEmpty(param.success)}" class="alert alert-success">
        <span th:text="${param.success[0]}"></span>
    </div>

    <div th:if="${param.error != null and !#arrays.isEmpty(param.error)}" class="alert alert-error">
        <span th:text="${param.error[0]}"></span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">Login</label>
            <input id="username" type="text" name="username" placeholder="example96">
        </div>

        <div class="field">
            <label for="password">Пароль</label>
            <input id="password" type="password" name="password" placeholder="Введите пароль">
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Войти</button>
    </form>

    <div class="footer">
        Нет аккаунта? <a th:href="@{/auth/register}">Зарегистрироваться</a>
    </div>
</div>
</body>
</html>
