server:
  port: 8085

app:
  account:
    base-url: http://localhost:8081

spring:
  application:
    name: front-app
  security:
    oauth2:
      client:
        registration:
          my_front:
            client-id: "my_front"
            client-secret: "123456"
            provider: my_front
            authorization-grant-type:
              - "authorization_code"
              - "client_credentials"
            client-authentication-method: client_secret_post
            redirect-uris: "http://localhost:8085/login/oauth2/code/my_front"
            scope: openid, write, user
        provider:
          my_front:
            issuer-uri: http://localhost:9000



logging:
  level:
    org.springframework.security: trace
    org.springframework.web.reactive.function.client.WebClient: TRACE
